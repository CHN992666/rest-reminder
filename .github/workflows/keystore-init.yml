name: Generate Release Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore with keytool
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias rest-release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass changeit -keypass changeit \
            -dname "CN=Rest Reminder, O=Personal, C=CN"

      - name: Print base64 for GitHub Secret
        run: |
          {
            echo "## Release keystore (one-time setup)"
            echo ""
            echo "Copy the base64 blob below into the repository secret named \`KEYSTORE_BASE64\`."
            echo "Also create these secrets with the values shown:"
            echo "- \`KEYSTORE_PASSWORD\` = \`changeit\`"
            echo "- \`KEY_ALIAS\` = \`rest-release\`"
            echo "- \`KEY_ALIAS_PASSWORD\` = \`changeit\`"
            echo ""
            echo "Repository path: Settings → Secrets and variables → Actions → New repository secret"
            echo ""
            echo '```'
            base64 -w0 release.keystore
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload keystore artifact (alternative to summary copy)
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: release.keystore
          retention-days: 1
